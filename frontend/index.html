<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>中国象棋</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="home-screen" id="homeScreen">
    <div class="home-inner">
        <div class="home-brand">
            <span class="home-seal">弈</span>
            <h1 class="home-title">中国象棋</h1>
            <p class="home-subtitle">楚河汉界 · 智趣对弈</p>
        </div>
        <nav class="home-menu">
            <button id="homeAiBtn" class="home-entry" type="button">
                <span class="home-entry-icon">智</span>
                <span class="home-entry-body">
                    <span class="home-entry-title">人机对战</span>
                    <span class="home-entry-sub">与 AI 对弈 · 四档难度</span>
                </span>
            </button>
            <button id="homePvpBtn" class="home-entry" type="button">
                <span class="home-entry-icon">弈</span>
                <span class="home-entry-body">
                    <span class="home-entry-title">双人对弈</span>
                    <span class="home-entry-sub">同屏热座 · 轮流落子</span>
                </span>
            </button>
            <button id="homeRoomBtn" class="home-entry" type="button">
                <span class="home-entry-icon">联</span>
                <span class="home-entry-body">
                    <span class="home-entry-title">远程对弈</span>
                    <span class="home-entry-sub">房间码联机 · 实时对战</span>
                </span>
            </button>
        </nav>
        <p class="home-footer">本地引擎 · 离线可玩</p>
    </div>
</div>

<div class="game-screen hidden" id="gameScreen">
    <div class="page game-page">
        <header class="game-topbar">
            <button id="backHomeBtn" class="back-btn round" type="button" aria-label="返回">‹</button>
            <div class="player-chip">
                <span class="avatar" id="topAvatar">白</span>
                <span class="player-chip-name" id="topPlayerName">小白</span>
            </div>
            <div class="topbar-right">
                <span class="step-chip" id="stepCounter">0步</span>
                <span class="avatar avatar-opponent" id="oppAvatar">弈</span>
            </div>
        </header>

        <main class="board-column">
            <div class="board-shell">
                <div class="board" id="board" aria-label="中国象棋棋盘">
                    <svg class="board-svg" id="boardSvg" viewBox="0 0 900 1000" aria-hidden="true"></svg>
                    <div class="layer layer-markers" id="markers"></div>
                    <div class="layer layer-pieces" id="pieces"></div>
                </div>
            </div>
            <div class="turn-strip" id="turnStrip">
                <span class="turn-dot" id="turnDot"></span>
                <span id="turnText">正在连接…</span>
                <span class="check-flag" id="checkFlag">将军</span>
            </div>
        </main>

        <nav class="game-toolbar">
            <button id="menuBtn" class="tool-btn" type="button">
                <span class="tool-icon">☰</span>
                <span class="tool-label">菜单</span>
            </button>
            <button id="analyzeBtn" class="tool-btn" type="button">
                <span class="tool-icon">◫</span>
                <span class="tool-label">分析</span>
            </button>
            <button id="toolbarUndoBtn" class="tool-btn" type="button">
                <span class="tool-icon">↶</span>
                <span class="tool-label">悔棋</span>
            </button>
            <button id="hintBtn" class="tool-btn" type="button">
                <span class="tool-icon">✦</span>
                <span class="tool-label">提示</span>
            </button>
        </nav>
    </div>

    <div class="drawer-scrim hidden" id="drawerScrim"></div>
    <aside class="side-column drawer" id="sideDrawer">
        <div class="drawer-head">
            <h2 class="drawer-title">菜单</h2>
            <button id="drawerCloseBtn" class="mini-btn" type="button">关闭</button>
        </div>

        <div class="hidden">
            <h1 id="gameTitle">双人对弈</h1>
            <p id="gameSubtitle">同屏热座 · 轮流落子</p>
        </div>

                <section class="panel">
                    <h2>对战模式</h2>
                    <div class="mode-tabs">
                        <button id="modeLocalBtn" class="mode-tab is-active" type="button">本地对弈</button>
                        <button id="modeRoomBtn" class="mode-tab" type="button">联网对战</button>
                    </div>

                    <div class="mode-body" id="localControls">
                        <div class="mode-tabs">
                            <button id="pvpBtn" class="mode-tab is-active" type="button">双人对弈</button>
                            <button id="aiModeBtn" class="mode-tab" type="button">人机对战</button>
                        </div>

                        <div class="actions">
                            <button id="newGameBtn" class="btn primary" type="button">新的一局</button>
                            <button id="undoBtn" class="btn" type="button">悔棋</button>
                        </div>

                        <div class="ai-settings hidden" id="aiSettings">
                            <div class="depth-field">
                                <span class="depth-label">执子</span>
                                <div class="seg-group" id="playerSide">
                                    <button type="button" class="seg-btn is-active" data-value="RED">执红（先手）</button>
                                    <button type="button" class="seg-btn" data-value="BLACK">执黑（后手）</button>
                                </div>
                            </div>
                            <div class="depth-field">
                                <span class="depth-label">AI 强度</span>
                                <div class="seg-group" id="aiDepth">
                                    <button type="button" class="seg-btn" data-value="4">入门 · 4 层</button>
                                    <button type="button" class="seg-btn is-active" data-value="6">进阶 · 6 层</button>
                                    <button type="button" class="seg-btn" data-value="10">高级 · 10 层</button>
                                    <button type="button" class="seg-btn" data-value="20">顶级 · 20 层</button>
                                </div>
                            </div>
                        </div>

                        <div class="resign-group" id="pvpResignGroup">
                            <button id="resignRedBtn" class="btn ghost" type="button">红方认输</button>
                            <button id="resignBlackBtn" class="btn ghost" type="button">黑方认输</button>
                        </div>
                        <div class="resign-group hidden" id="aiResignGroup">
                            <button id="aiResignBtn" class="btn ghost" type="button">认输</button>
                        </div>
                    </div>

                    <div class="mode-body hidden" id="roomControls">
                        <div class="room-entry" id="roomEntry">
                            <div class="actions">
                                <button id="createRoomBtn" class="btn primary" type="button">创建房间（执红）</button>
                            </div>
                            <div class="join-row">
                                <input id="roomCodeInput" class="room-code-input" type="text" maxlength="8"
                                       placeholder="输入房间号" autocomplete="off" spellcheck="false"
                                       autocorrect="off" autocapitalize="characters" inputmode="text">
                                <button id="joinRoomBtn" class="btn" type="button">加入</button>
                            </div>
                            <div class="join-row server-row">
                                <input id="serverUrlInput" class="room-code-input" type="text"
                                       placeholder="服务器地址（留空=本机）" autocomplete="off" spellcheck="false"
                                       autocorrect="off" autocapitalize="off" inputmode="url">
                                <button id="saveServerBtn" class="btn" type="button">保存</button>
                            </div>
                        </div>
                        <div class="room-status" id="roomStatus">尚未进入房间</div>
                        <div class="room-badges" id="roomBadges"></div>
                        <div class="room-actions">
                            <button id="copyRoomBtn" class="btn ghost" type="button" disabled>复制邀请链接</button>
                            <button id="roomUndoBtn" class="btn ghost" type="button" disabled>悔棋</button>
                            <button id="roomResignBtn" class="btn ghost" type="button" disabled>认输</button>
                            <button id="leaveRoomBtn" class="btn ghost" type="button" disabled>离开房间</button>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <h2>对局状态</h2>
                    <div class="status-line" id="statusLine">正在连接服务器…</div>
                    <div class="result-line" id="resultLine"></div>
                    <div class="meta-row"><span>模式</span><strong id="modeText">本地</strong></div>
                    <div class="meta-row"><span>回合</span><strong id="plyText">0</strong></div>
                    <div class="meta-row"><span>对局号</span><strong id="gameIdText">—</strong></div>
                    <div class="clock-row">
                        <div class="clock-card red">
                            <span>红方用时</span>
                            <strong id="redClock">00:00</strong>
                        </div>
                        <div class="clock-card black">
                            <span>黑方用时</span>
                            <strong id="blackClock">00:00</strong>
                        </div>
                    </div>
                </section>

                <section class="panel history-panel">
                    <h2>
                        棋谱
                        <button id="exportBtn" class="mini-btn" type="button" disabled>导出</button>
                    </h2>
                    <div class="history" id="history">
                        <div class="history-empty">尚未落子</div>
                    </div>
                </section>

                <section class="panel records-panel">
                    <h2>历史对局</h2>
                    <div class="records" id="records">
                        <div class="history-empty">加载中…</div>
                    </div>
                </section>
    </aside>
</div>

<dialog class="replay-dialog" id="replayDialog">
    <div class="replay-head">
        <h3>对局复盘</h3>
        <button id="replayCloseBtn" class="btn ghost" type="button">关闭</button>
    </div>
    <div class="replay-body">
        <div class="board replay-board" id="replayBoard" aria-label="复盘棋盘">
            <svg class="board-svg" viewBox="0 0 900 1000" aria-hidden="true"></svg>
            <div class="layer layer-markers"></div>
            <div class="layer layer-pieces"></div>
        </div>
        <div class="replay-side">
            <p class="replay-info" id="replayInfo">正在加载…</p>
            <input class="replay-slider" id="replaySlider" type="range" min="0" max="0" value="0">
            <div class="replay-controls">
                <button id="replayFirstBtn" class="btn ghost" type="button">开局</button>
                <button id="replayPrevBtn" class="btn ghost" type="button">上一步</button>
                <button id="replayNextBtn" class="btn ghost" type="button">下一步</button>
                <button id="replayLastBtn" class="btn ghost" type="button">末步</button>
            </div>
            <div class="replay-note">复盘数据由服务端按存档棋谱重放生成。</div>
        </div>
    </div>
</dialog>

<dialog class="result-dialog" id="resultDialog">
    <div class="result-body">
        <h3 class="result-title" id="resultTitle">对局结束</h3>
        <p class="result-reason" id="resultReason"></p>
        <button id="resultAgainBtn" class="btn primary" type="button">再来一局</button>
    </div>
</dialog>

<dialog class="analyze-dialog" id="analyzeDialog">
    <div class="analyze-head">
        <h3>局面分析</h3>
        <button id="analyzeCloseBtn" class="btn ghost" type="button">关闭</button>
    </div>
    <div class="analyze-body">
        <div class="analyze-turn" id="analyzeTurn">轮到 红方</div>
        <div class="eval-wrap">
            <div class="eval-bar">
                <div class="eval-bar-red" id="evalBarRed"></div>
                <div class="eval-bar-black" id="evalBarBlack"></div>
            </div>
            <div class="eval-labels">
                <span>红方</span>
                <span class="eval-score" id="evalScore">均势</span>
                <span>黑方</span>
            </div>
        </div>
        <div class="analyze-best">
            <span class="analyze-label">最佳走法</span>
            <strong class="analyze-best-move" id="analyzeBest">—</strong>
        </div>
        <div class="analyze-meta">
            <span>深度 <strong id="analyzeDepth">0</strong> 层</span>
            <span>节点 <strong id="analyzeNodes">0</strong></span>
        </div>
        <div class="depth-field">
            <span class="depth-label">搜索深度</span>
            <div class="seg-group" id="analyzeDepthGroup">
                <button type="button" class="seg-btn" data-value="4">4 层</button>
                <button type="button" class="seg-btn is-active" data-value="6">6 层</button>
                <button type="button" class="seg-btn" data-value="10">10 层</button>
                <button type="button" class="seg-btn" data-value="20">20 层</button>
            </div>
        </div>
        <div class="analyze-candidates" id="analyzeCandidates">
            <div class="analyze-empty">分析中…</div>
        </div>
        <button id="analyzeRunBtn" class="btn primary" type="button">重新分析</button>
    </div>
</dialog>

<div class="toast" id="toast"></div>
<div class="loading hidden" id="loading">
    <span class="spinner"></span>
    <span id="loadingText">正在连接对局…</span>
</div>

<script src="js/api.js" defer></script>
<script src="js/engine.js" defer></script>
<script src="js/sound.js" defer></script>
<script src="js/board.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
